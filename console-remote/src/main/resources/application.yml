logging.level:
  org.springframework: info
    #transaction: info
    #security: trace
    #context.support.ResourceBundleMessageSource: DEBUG
  io.extact: debug

spring:
  messages:
    basename: fw-messages,application-messages
    encoding: UTF-8

server:
  port: 9080 # for actuator

management:
  endpoints:
    web:
      exposure:
        include: "*"
        exclude: "env,beans"
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
      group:
        readiness:
          include: "readinessState,db"
      validate-group-membership: false # groupにindicatorが存在しない場合もエラーにしない設定
  zipkin:
    tracing:
      endpoint: http://localhost:9411/api/v2/spans
  tracing:
    sampling:
      probability: 1.0  # 100%サンプリング（開発環境向け）

rms:
  debug:
    configdump:
      enable: true # change to true in the test class
      #system-properties: on
      #system-environment: on
  application:
    url: http://localhost:8080
    format:
      date: yyyyMMdd
      date-time: yyyyMMdd HH:mm

# $ docker compose up
services:
  rms-application:
    image: msa-spring-rms-application:0.0.1-SNAPSHOT
    environment:
      - SPRING_PROFILES_ACTIVE=item-jpa,reservation-jpa,user-remote
      - RMS_PERSISTENCE_USER_REMOTE_URL=http://rms-remote:8081/remote
      - RMS_HEALTH_DEPEND_SERVICES=http://rms-remote:8081/actuator/health/readiness
      - RMS_DATASOURCE_APPLICATION_URL=jdbc:postgresql://app-db:5432/postgres
      - RMS_DATASOURCE_APPLICATION_USERNAME=app-user
      - RMS_DATASOURCE_APPLICATION_PASSWORD=app-postgres
      - RMS_DATASOURCE_FW_URL=jdbc:postgresql://fw-db:5432/postgres
      - RMS_DATASOURCE_FW_USERNAME=fw-user
      - RMS_DATASOURCE_FW_PASSWORD=fw-postgres
      - RMS_LOGIN_USER_ATTRIBUTES.CACHE.ENABLED=true
      - RMS_LOGIN_USER_ATTRIBUTES.CACHE.TYPE=redis
      - RMS_DEBUG_CONFIGDUMP_ENABLE=true
      - ENV_OTLP_ENABLED=false
      - ENV_OTLP_ENDPOINT_HOST=host.docker.internal
      - LANG=ja_JP.UTF-8
      - LANGUAGE=ja_JP:ja
      - LC_ALL=ja_JP.UTF-8
      - TZ=Asia/Tokyo
    ports:
      - "8080:8080"
    networks:
      - spring-network

  rms-remote:
    image: msa-spring-rms-remote-resources:0.0.1-SNAPSHOT
    environment:
      - SPRING_APPLICATION_NAME=remote-user-application
      - SPRING_PROFILES_ACTIVE=user
      - RMS_DATASOURCE_FW_URL=jdbc:postgresql://fw-db:5432/postgres
      - RMS_DATASOURCE_FW_USERNAME=fw-user
      - RMS_DATASOURCE_FW_PASSWORD=fw-postgres
      - RMS_DATASOURCE_FW_SQL_MODE=NEVER
      - RMS_LOGIN_USER_ATTRIBUTES.CACHE.ENABLED=true
      - RMS_LOGIN_USER_ATTRIBUTES.CACHE.TYPE=redis
      - RMS_DEBUG_CONFIGDUMP_ENABLE=true
      - ENV_OTLP_ENABLED=false
      - ENV_OTLP_ENDPOINT_HOST=host.docker.internal
      - LANG=ja_JP.UTF-8
      - LANGUAGE=ja_JP:ja
      - LC_ALL=ja_JP.UTF-8
      - TZ=Asia/Tokyo
    ports:
      - "8081:8081"
    networks:
      - spring-network

  app-db:
    image: postgres:16-alpine
    ports:
      - 5432:5432
    environment:
      POSTGRES_USER: "app-user"
      POSTGRES_PASSWORD: "app-postgres"
    networks:
      - spring-network

  fw-db:
    image: postgres:16-alpine
    ports:
      - 5433:5432
    environment:
      POSTGRES_USER: "fw-user"
      POSTGRES_PASSWORD: "fw-postgres"
    networks:
      - spring-network

  redis:
    image: redis:6.2.6
    ports:
      - "6379:6379"
    networks:
      - spring-network
  
networks:
  spring-network:
    driver: bridge
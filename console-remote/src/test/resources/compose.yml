# $ docker compose up
services:
  rms-application:
    image: msa-spring-rms-application:0.0.1-SNAPSHOT
    environment:
      - SPRING_PROFILES_ACTIVE=item-file,reservation-jpa,user-remote
      - RMS_PERSISTENCE_USER_REMOTE_URL=http://rms-remote:8081/remote
      - RMS_HEALTH_DEPEND_SERVICES=http://rms-remote:8081/actuator/health/readiness
      - RMS_DEBUG_CONFIGDUMP_ENABLE=false
      - ENV_OTLP_ENABLED=true
      - ENV_OTLP_ENDPOINT_HOST=host.docker.internal
      - LANG=ja_JP.UTF-8
      - LANGUAGE=ja_JP:ja
      - LC_ALL=ja_JP.UTF-8
      - TZ=Asia/Tokyo
    ports:
      - "8080:8080"
    networks:
      - spring-network

  rms-remote:
    image: msa-spring-rms-remote-resources:0.0.1-SNAPSHOT
    environment:
      - SPRING_APPLICATION_NAME=remote-user-application
      - SPRING_PROFILES_ACTIVE=user
      - RMS_DEBUG_CONFIGDUMP_ENABLE=false
      - ENV_OTLP_ENABLED=true
      - ENV_OTLP_ENDPOINT_HOST=host.docker.internal
      - LANG=ja_JP.UTF-8
      - LANGUAGE=ja_JP:ja
      - LC_ALL=ja_JP.UTF-8
      - TZ=Asia/Tokyo
    ports:
      - "8081:8081"
    networks:
      - spring-network

networks:
  spring-network:
    driver: bridge